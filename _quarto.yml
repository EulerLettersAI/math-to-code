project:
  type: website
  output-dir: _site
  resources:
    - "lessons/**/*.ipynb"
    - "lessons/**/*.Rmd"
    - requirements.txt

website:
  title: "Math to Code"
  description: "Executable lessons connecting mathematical ideas to code."
  site-url: "https://eulerlettersai.github.io/math-to-code/"
  repo-url: "https://github.com/EulerLettersAI/math-to-code"
  repo-actions: [source, issue]
  page-navigation: true
  search:
    location: navbar
    type: overlay
  sidebar:
    - id: svm-classical-vs-quantum
      title: "SVM: Classical and Quantum Kernels"
      style: floating
      collapse-level: 2
      contents:
        - text: "Lesson overview"
          href: lessons/svm-classical-vs-quantum/index.qmd
        - section: "Notebooks"
          contents:
            - text: "1. Support Vector Machines"
              href: lessons/svm-classical-vs-quantum/1.0-svm.ipynb
            - text: "2. Kernels in SVMs"
              href: lessons/svm-classical-vs-quantum/2.0-kernel.ipynb
            - text: "3. Classical vs Quantum"
              href: lessons/svm-classical-vs-quantum/3.0-classical-vs-quantum.ipynb
        - section: "Refreshers"
          contents:
            - text: "1.1 Margin Geometry"
              href: lessons/svm-classical-vs-quantum/1.1-margin-geometry.ipynb
    - id: optimization-primal-dual
      title: "Optimization: Primal and Dual"
      style: floating
      collapse-level: 2
      contents:
        - text: "Lesson overview"
          href: lessons/optimization-primal-dual/index.qmd
        - section: "Notebooks"
          contents:
            - text: "1. A Simple Optimization Problem"
              href: lessons/optimization-primal-dual/1.0-simple-optimization.ipynb
            - text: "2. Primal and Dual Problems"
              href: lessons/optimization-primal-dual/2.0-primal-and-dual.ipynb
    - id: statistics-and-probability-for-data-science
      title: "Statistics and Probability for Data Science"
      style: floating
      collapse-level: 2
      contents:
        - text: "Course overview"
          href: lessons/statistics-and-probability-for-data-science/index.Rmd
        - section: "SD01 — Statistical Thinking"
          contents:
            - text: "Data Matrices, Variable Types, and Association"
              href: lessons/statistics-and-probability-for-data-science/SD01-01-data-matrices-and-variables.Rmd
            - text: "Covariates, Confounding, Association, and Causation"
              href: lessons/statistics-and-probability-for-data-science/SD01-02-covariates-confounding-and-causation.Rmd
            - text: "Populations and Sampling Designs"
              href: lessons/statistics-and-probability-for-data-science/SD01-03-populations-and-sampling.Rmd
        - section: "SD02 — Exploratory Data Analysis"
          contents:
            - text: "Descriptive Statistics and Quantiles"
              href: lessons/statistics-and-probability-for-data-science/SD02-01-descriptive-statistics-and-quantiles.Rmd
            - text: "Shape and Plots for One Numerical Variable"
              href: lessons/statistics-and-probability-for-data-science/SD02-02-shape-and-univariate-plots.Rmd
            - text: "Comparing Variables with Plots"
              href: lessons/statistics-and-probability-for-data-science/SD02-03-comparing-variables-with-plots.Rmd
    - id: advanced-statistical-modeling
      title: "Advanced Statistical Modeling"
      style: floating
      collapse-level: 2
      contents:
        - text: "Lesson overview"
          href: lessons/advanced-statistical-modeling/index.qmd
        - section: "Lessons"
          contents:
            - text: "1. Logistic Regression and p-values"
              href: lessons/advanced-statistical-modeling/1-logistic-regression.Rmd
            - text: "2. Mixed-Effects Logistic Regression"
              href: lessons/advanced-statistical-modeling/2-mixed-effects-logistic-regression.Rmd
    - id: power-flow-state-estimation
      title: "Power Flow and State Estimation"
      style: floating
      collapse-level: 2
      contents:
        - text: "Lesson overview"
          href: lessons/power-flow-state-estimation/index.qmd
        - section: "Notebooks"
          contents:
            - text: "1. Power-Flow Analysis"
              href: lessons/power-flow-state-estimation/1.0-power-flow-analysis.ipynb
            - text: "2. WLS State Estimation"
              href: lessons/power-flow-state-estimation/2.0-wls-state-estimation.ipynb
            - text: "3. State-Estimation Observability"
              href: lessons/power-flow-state-estimation/3.0-state-estimation-observability.ipynb
  page-footer:
    left: "© EulerLettersAI"
    center: '<div id="quarto-search" title="Search lessons"></div>'
    right:
      - text: "Main website"
        href: https://eulerlettersai.github.io/
      - text: "GitHub"
        href: https://github.com/EulerLettersAI/math-to-code

format:
  html:
    theme: darkly
    css: navbar.css
    include-before-body: parent-header.html
    include-after-body: download-links.html
    toc: true
    code-copy: true
    code-fold: show
    code-overflow: wrap
    highlight-style: monokai
    anchor-sections: true
    link-external-newwindow: true
    html-math-method: mathjax

execute:
  freeze: auto
  warning: false
