project:
  type: website
  output-dir: _site
  resources:
    - "lessons/**/*.ipynb"
    - "lessons/**/*.Rmd"
    - requirements.txt

website:
  title: "Math to Code"
  description: "Executable lessons connecting mathematical ideas to code."
  site-url: "https://eulerlettersai.github.io/math-to-code/"
  repo-url: "https://github.com/EulerLettersAI/math-to-code"
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    title: false
    logo: assets/logo_header.png
    logo-alt: "Euler Letters AI"
    logo-href: https://eulerlettersai.github.io/
    left:
      - text: Introduction
        href: https://eulerlettersai.github.io/index.html#introduction
      - text: Lead
        href: https://eulerlettersai.github.io/index.html#lead-profile
      - text: Publications
        href: https://eulerlettersai.github.io/publications.html
      - text: Projects
        href: https://eulerlettersai.github.io/projects.html
      - text: Math to Code
        href: index.qmd
      - text: Letters & Verse
        href: https://eulerlettersai.github.io/letters-and-verse/
      - text: Light & Lens
        href: https://eulerlettersai.github.io/light-and-lens/
      - text: References
        href: https://eulerlettersai.github.io/index.html#references
      - text: Contact
        href: https://eulerlettersai.github.io/index.html#contact
    right:
      - icon: github
        href: https://github.com/EulerLettersAI/math-to-code
        aria-label: GitHub
  sidebar:
    - id: svm-classical-vs-quantum
      title: "SVM: Classical and Quantum Kernels"
      style: floating
      collapse-level: 2
      contents:
        - text: "Lesson overview"
          href: lessons/svm-classical-vs-quantum/index.qmd
        - section: "Notebooks"
          contents:
            - text: "1. Support Vector Machines"
              href: lessons/svm-classical-vs-quantum/1.0-svm.ipynb
            - text: "2. Kernels in SVMs"
              href: lessons/svm-classical-vs-quantum/2.0-kernel.ipynb
            - text: "3. Classical vs Quantum"
              href: lessons/svm-classical-vs-quantum/3.0-classical-vs-quantum.ipynb
        - section: "Refreshers"
          contents:
            - text: "1.1 Margin Geometry"
              href: lessons/svm-classical-vs-quantum/1.1-margin-geometry.ipynb
    - id: optimization-primal-dual
      title: "Optimization: Primal and Dual"
      style: floating
      collapse-level: 2
      contents:
        - text: "Lesson overview"
          href: lessons/optimization-primal-dual/index.qmd
        - section: "Notebooks"
          contents:
            - text: "1. A Simple Optimization Problem"
              href: lessons/optimization-primal-dual/1.0-simple-optimization.ipynb
            - text: "2. Primal and Dual Problems"
              href: lessons/optimization-primal-dual/2.0-primal-and-dual.ipynb
    - id: logistic-mixed-effects
      title: "Logistic and Mixed-Effects Regression"
      style: floating
      collapse-level: 2
      contents:
        - text: "Lesson overview"
          href: lessons/logistic-mixed-effects/index.qmd
        - section: "Lessons"
          contents:
            - text: "1. Logistic Regression and p-values"
              href: lessons/logistic-mixed-effects/1-logistic-regression.Rmd
            - text: "2. Mixed-Effects Logistic Regression"
              href: lessons/logistic-mixed-effects/2-mixed-effects-logistic-regression.Rmd
    - id: power-flow-state-estimation
      title: "Power Flow and State Estimation"
      style: floating
      collapse-level: 2
      contents:
        - text: "Lesson overview"
          href: lessons/power-flow-state-estimation/index.qmd
        - section: "Notebooks"
          contents:
            - text: "1. Power-Flow Analysis"
              href: lessons/power-flow-state-estimation/1.0-power-flow-analysis.ipynb
            - text: "2. WLS State Estimation"
              href: lessons/power-flow-state-estimation/2.0-wls-state-estimation.ipynb
            - text: "3. State-Estimation Observability"
              href: lessons/power-flow-state-estimation/3.0-state-estimation-observability.ipynb
  page-footer:
    left: "© EulerLettersAI"
    center: "Mathematics you can read, run, and change."
    right:
      - text: "Main website"
        href: https://eulerlettersai.github.io/
      - text: "Source"
        href: https://github.com/EulerLettersAI/math-to-code

format:
  html:
    theme: 
      light: flatly
      dark: darkly
    css: navbar.css
    include-after-body: download-links.html
    toc: true
    code-copy: true
    code-fold: show
    code-overflow: wrap
    highlight-style: monokai
    anchor-sections: true
    link-external-newwindow: true
    html-math-method: mathjax

execute:
  freeze: auto
  warning: false
