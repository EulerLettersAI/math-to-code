project:
  type: website
  output-dir: _site
  resources:
    - "lessons/**/*.ipynb"
    - requirements.txt

website:
  title: "Math to Code"
  description: "Executable lessons connecting mathematical ideas to code."
  site-url: "https://eulerlettersai.github.io/math-to-code/"
  repo-url: "https://github.com/EulerLettersAI/math-to-code"
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    title: false
    logo: assets/euler-letters-ai-logo.png
    logo-alt: "Euler Letters AI"
    logo-href: https://eulerlettersai.github.io/
    left:
      - text: Home
        href: index.qmd
      - text: Lessons
        href: lessons/index.qmd
    right:
      - icon: github
        href: https://github.com/EulerLettersAI/math-to-code
        aria-label: GitHub
  sidebar:
    - id: classical-vs-quantum
      title: "Classical and Quantum Kernels"
      style: floating
      collapse-level: 2
      contents:
        - text: "Lesson overview"
          href: lessons/classical-vs-quantum/index.qmd
        - section: "Notebooks"
          contents:
            - text: "1. Support Vector Machines"
              href: lessons/classical-vs-quantum/1.0-svm.ipynb
            - text: "2. Kernels in SVMs"
              href: lessons/classical-vs-quantum/2.0-kernel.ipynb
            - text: "3. Classical vs Quantum"
              href: lessons/classical-vs-quantum/3.0-classical-vs-quantum.ipynb
    - id: optimization-primal-dual
      title: "Optimization: Primal and Dual"
      style: floating
      collapse-level: 2
      contents:
        - text: "Lesson overview"
          href: lessons/optimization-primal-dual/index.qmd
        - section: "Notebooks"
          contents:
            - text: "1. A Simple Optimization Problem"
              href: lessons/optimization-primal-dual/1.0-simple-optimization.ipynb
            - text: "2. Primal and Dual Problems"
              href: lessons/optimization-primal-dual/2.0-primal-and-dual.ipynb
    - id: logistic-mixed-effects
      title: "Logistic and Mixed-Effects Regression"
      style: floating
      collapse-level: 2
      contents:
        - text: "Lesson overview"
          href: lessons/logistic-mixed-effects/index.qmd
        - section: "Lessons"
          contents:
            - text: "1. Logistic Regression and p-values"
              href: lessons/logistic-mixed-effects/1-logistic-regression.Rmd
            - text: "2. Mixed-Effects Logistic Regression"
              href: lessons/logistic-mixed-effects/2-mixed-effects-logistic-regression.Rmd
  page-footer:
    left: "© EulerLettersAI"
    center: "Mathematics you can read, run, and change."
    right:
      - text: "Main website"
        href: https://eulerlettersai.github.io/
      - text: "Source"
        href: https://github.com/EulerLettersAI/math-to-code

format:
  html:
    theme: 
      light: flatly
      dark: darkly
    css: navbar.css
    include-after-body: download-links.html
    toc: true
    code-copy: true
    code-fold: show
    code-overflow: wrap
    highlight-style: monokai
    anchor-sections: true
    link-external-newwindow: true
    html-math-method: mathjax

execute:
  freeze: auto
  warning: false
