<script>
(() => {
  document.body.prepend(document.querySelector('.ela-site-header'));
  const toggle = document.getElementById('ela-nav-toggle');
  const nav = document.getElementById('ela-main-nav');
  toggle.addEventListener('click', () => {
    toggle.setAttribute('aria-expanded', nav.classList.toggle('open'));
  });
  nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    nav.classList.remove('open');
    toggle.setAttribute('aria-expanded', 'false');
  }));
})();
</script>
